name: Push Looker Studio Ingester Image

on:
  push:
    branches:
      - main
    paths:
      - 'integrations/datastudio/**'
      - 'bap_proto/**'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.github/workflows/push-datastudio-ingester.yaml'
  # TODO: Remove. Only for testing
  pull_request:
    branches:
      - main
    paths:
      - 'integrations/datastudio/**'
      - 'bap_proto/**'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.github/workflows/push-datastudio-ingester.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  push_ingester_image:
    name: Build and Push Ingester OCI Image
    # TODO: Uncomment the line below before merging so PRs do not push to Artifact Registry:
    # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: linux-x86-n4-16-buildkit
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest@sha256:e1461af32bf27640ddbcde7c3e7a10f194142779e9ed3bba962040812e626a1c # ratchet:us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Mark workspace as safe for git rev-parse
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Authenticate config with Metadata Server for crane
        env:
          METADATA_TOKEN_URL: ${{ vars.GKE_METADATA_TOKEN_URL || secrets.GKE_METADATA_TOKEN_URL }}
        run: |
          python3 - << 'EOF'
          import base64, json, pathlib, urllib.request

          req = urllib.request.Request(
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token",
              headers={"Metadata-Flavor": "Google"},
          )
          with urllib.request.urlopen(req) as resp:
              token = json.loads(resp.read().decode())["access_token"]

          auth = base64.b64encode(f"oauth2accesstoken:{token}".encode()).decode()
          docker_dir = pathlib.Path.home() / ".docker"
          docker_dir.mkdir(parents=True, exist_ok=True)
          (docker_dir / "config.json").write_text(
              json.dumps({"auths": {"us-docker.pkg.dev": {"auth": auth}}})
          )
          EOF

      - name: Build and push OCI image via Bazel
        run: |
          bazel run //integrations/datastudio:bap_datastudio_ingester_push