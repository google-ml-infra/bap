[project]
name = "bap"
version = "0.1.0"
requires-python = "~=3.11"

dependencies = [
    "cloudevents",
    "functions-framework",
    "google-cloud-bigquery",
    "google-cloud-pubsub",
    "numpy",
    "protobuf",
    "protovalidate",
    "tabulate",
    "tensorboard",
]

[project.optional-dependencies]
test = [
    "pytest",
    "tensorboardx",
    "tensorflow",
]
